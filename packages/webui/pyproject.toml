[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neomagi-webui"
version = "0.1.3"
description = "NeoMAGI operator WebUI dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.124,<1",
    "jinja2>=3,<4",
    "neomagi-pi",
    "uvicorn>=0.40,<1",
]

[project.scripts]
magipi-webui = "webui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/webui",
]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "src",
    "tests",
]
