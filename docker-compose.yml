services:

  # ===========================================
  # PostgreSQL - 共享数据库
  #
  # Usage:
  #   podman compose -f docker-compose.yml up -d
  #   podman compose -f docker-compose.yml down
  #
  # Extensions (pg_search, vector) are auto-installed via
  # init-scripts/ on first init (empty PGDATA). To re-init,
  # run `podman compose down -v` then `up -d`.
  #
  # Inspect installed extensions:
  #   podman exec -it neomagi-postgres \
  #     psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c '\dx'
  # ===========================================
  postgres:
    image: docker.io/paradedb/paradedb:0.23.2-pg18
    container_name: neomagi-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-neomagi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      POSTGRES_DB: ${DATABASE_NAME:-neomagi}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data: