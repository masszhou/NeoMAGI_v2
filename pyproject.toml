[project]
name = "neomagi-v2"
version = "0.1.3"
description = "NeoMAGI v2 repository workspace"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "neomagi-pi",
]

[dependency-groups]
dev = [
    "ruff==0.15.11",
    "pytest>=8",
    "hypothesis>=6",
]

[tool.uv]
package = false

[tool.uv.sources]
neomagi-pi = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/magipi",
]
