[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neomagi-v2"
version = "0.1.0"
description = "NeoMAGI v2 — local-first personal agent CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.69.0",
    "jsonschema>=4,<5",
    "openai>=2.0.0",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "wcwidth>=0.2.13",
]

[project.scripts]
neomagi = "cli.__main__:main"

[dependency-groups]
dev = [
    "ruff==0.15.11",
    "pytest>=8",
    "hypothesis>=6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/ai_provider",
    "src/agent_core",
    "src/cli",
    "src/tui",
    "src/storage",
    "src/policy",
    "src/infra",
]
